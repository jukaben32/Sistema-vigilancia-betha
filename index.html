<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Vigilancia</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Sistema de Vigilancia</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <!-- Cámara en vivo -->
            <div class="col-lg-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Cámara en Vivo</h5>
                    </div>
                    <div class="card-body">
                        <video id="videoElement" class="w-100" autoplay playsinline></video>
                        <canvas id="canvasElement" style="display: none;"></canvas>
                    </div>
                    <div class="card-footer">
                        <div class="d-flex justify-content-between align-items-center">
                            <span id="status" class="text-muted">Estado: Iniciando...</span>
                            <button id="toggleCamera" class="btn btn-primary">Iniciar Cámara</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Galería de capturas -->
            <div class="col-lg-4">
                <div class="card shadow">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Últimas Capturas</h5>
                    </div>
                    <div class="card-body">
                        <!-- Filtros -->
                        <div class="mb-3">
                            <div class="input-group">
                                <input type="date" class="form-control" id="dateFilter">
                                <button class="btn btn-outline-secondary" type="button" id="clearFilter">
                                    <i class="bi bi-x-circle"></i> Limpiar
                                </button>
                            </div>
                        </div>
                        <div id="captureGallery" class="gallery-container">
                            <!-- Las imágenes se cargarán aquí dinámicamente -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para vista previa de imagen -->
    <div class="modal fade" id="imagePreviewModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Vista Previa</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="previewImage" class="img-fluid" src="" alt="Preview">
                    <div class="mt-3">
                        <p id="imageTimestamp" class="text-muted"></p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-primary" id="downloadImage">
                        <i class="bi bi-download"></i> Descargar
                    </button>
                    <button type="button" class="btn btn-success" id="shareImage">
                        <i class="bi bi-share"></i> Compartir
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="app.js"></script>
</body>
</html>
